<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NeonFlow Exchange — Торговля криптоактивами</title>
    <meta name="description" content="NeonFlow Exchange — быстрая торговля криптовалютой, спот и контракты. Безопасный вывод, поддержка 24/7." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#050505',
              surface: '#0a0a0a',
              neon: '#a3e635', // Lime 400
              subtle: '#1f1f1f',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Roboto Mono', 'monospace'],
            },
          },
        },
      }
    </script>
    <style>
      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      body {
        background-color: #050505;
        color: #e5e5e5;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        overflow-x: hidden;
        min-height: 100dvh;
      }
      input, select, textarea {
        font-size: 16px !important;
        touch-action: manipulation;
      }
      input:focus, select:focus, textarea:focus {
        font-size: 16px !important;
      }
      /* Keep focused input visible when keyboard opens (scroll margin) */
      input, textarea, select {
        scroll-margin-bottom: 80px;
      }
      /* Instant touch response, no 300ms delay */
      button, a, [role="button"], .cursor-pointer {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom scrollbar for "Excel" feel */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }
      @keyframes slide-in-right {
        from { opacity: 0; transform: translateX(24px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slide-in-right 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scale-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes check-draw {
        from { stroke-dashoffset: 24; opacity: 0.6; }
        to { stroke-dashoffset: 0; opacity: 1; }
      }
      .animate-check-draw {
        stroke-dasharray: 24;
        animation: check-draw 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
        stroke-dashoffset: 24;
      }
      @keyframes circle-fade {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-circle-fade {
        animation: circle-fade 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
