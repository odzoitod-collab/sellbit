# Render Blueprint — статический сайт (SPA)
# Если репозиторий — монорепо (корень sellbit), в Dashboard укажите Root Directory: neonflow-crypto-exchange

services:
  - type: web
    name: neonflow-crypto-exchange
    runtime: static

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    # SPA: все маршруты отдавать index.html (клиентский роутинг)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Автодеплой при пуше в ветку по умолчанию
    autoDeployTrigger: commit
